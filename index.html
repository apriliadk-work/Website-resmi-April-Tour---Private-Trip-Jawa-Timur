<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>April Tour — Private Trip East Java</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Plus+Jakarta+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--c-dark:#1a1409;--c-accent:#c4622d;--c-gold:#b8933e;--c-white:#faf7f0;--font-display:'Cormorant Garamond',serif;--font-body:'Plus Jakarta Sans',sans-serif;--font-title:'Bebas Neue',sans-serif}
    body{font-family:var(--font-body);background:var(--c-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .bg{position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
    .ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border:1px solid rgba(196,98,45,0.1);border-radius:50%;pointer-events:none;animation:pulse 5s ease-in-out infinite}
    .ring::after{content:'';position:absolute;inset:40px;border:1px solid rgba(196,98,45,0.05);border-radius:50%}
    @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
    .wrap{position:relative;z-index:2;text-align:center;padding:40px 20px;animation:up 1s ease forwards}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .logo{font-family:var(--font-title);font-size:clamp(3rem,10vw,5.5rem);letter-spacing:0.2em;color:var(--c-white);line-height:1;margin-bottom:8px}
    .sub{font-size:0.65rem;letter-spacing:0.45em;text-transform:uppercase;color:var(--c-accent);margin-bottom:60px;display:block}
    .line{width:60px;height:1px;background:rgba(255,255,255,0.12);margin:0 auto 48px}
    .prompt{font-family:var(--font-display);font-size:clamp(1.1rem,3vw,1.5rem);font-weight:300;color:rgba(255,255,255,0.55);margin-bottom:48px;font-style:italic}
    .opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
    .btn{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 48px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);text-decoration:none;transition:all 0.4s ease;min-width:180px}
    .btn:hover{border-color:var(--c-accent);background:rgba(196,98,45,0.08);transform:translateY(-4px)}
    .flag{font-size:2.5rem;line-height:1}
    .name{font-family:var(--font-title);font-size:1.5rem;letter-spacing:0.2em;color:var(--c-white)}
    .lbl{font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.35)}
    .note{margin-top:60px;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.15)}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="ring"></div>
<div class="wrap">
  <div class="logo">APRIL TOUR</div>
  <span class="sub">Private Trip East Java · Jawa Timur</span>
  <div class="line"></div>
  <p class="prompt">Choose your language / Pilih bahasa kamu</p>
  <div class="opts">
    <a href="en/index.html" class="btn">
      <span class="flag">🇬🇧</span>
      <span class="name">ENGLISH</span>
      <span class="lbl">English version</span>
    </a>
    <a href="id/index.html" class="btn">
      <span class="flag">🇮🇩</span>
      <span class="name">INDONESIA</span>
      <span class="lbl">Versi Indonesia</span>
    </a>
  </div>
  <p class="note">© 2025 April Tour · East Java, Indonesia</p>
</div>
</body>
</html>
